# member-api runtime configuration.
# Lives in s3://member-api-config/application.properties; the API reads it at startup.
# A copy of the last version that worked is kept as application.properties.last-known-good.
server.port=8080
db.url=jdbc:postgresql://127.0.0.1:5432/memberdb
db.user=api
db.password=api
db.pool.size=5
db.pool.timeout.ms=3000
db.statement.timeout.s=30
log.dir=/var/log/member-api
